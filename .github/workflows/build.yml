name: Build and Publish OneLock Browser
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Restore signing keystore
        env:
          ONELOCK_KS_B64: ${{ secrets.ONELOCK_KS_B64 }}
        run: echo "$ONELOCK_KS_B64" | base64 -d > onelock-upload.keystore

      - name: Build release APK
        env:
          ONELOCK_KS_PASS: ${{ secrets.ONELOCK_KS_PASS }}
        run: gradle assembleRelease -x lint -x lintVitalRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onelockbrowser-build
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="b-v$VN"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "OneLock Browser $VN" \
              --notes "OneLock Browser $VN (build $VC). Companion safe browser — installs alongside OneLock."
          cp "$APK" "OneLockBrowser-v${VN}-release.apk"
          gh release upload "$TAG" "OneLockBrowser-v${VN}-release.apk" --repo "$GITHUB_REPOSITORY" --clobber
