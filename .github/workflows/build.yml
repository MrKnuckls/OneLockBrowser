name: build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ONELOCK_KS_B64: ${{ secrets.ONELOCK_KS_B64 }}
        run: echo "$ONELOCK_KS_B64" | base64 -d > onelock-upload.keystore

      - name: Build release APK
        env:
          ONELOCK_KS_PASS: ${{ secrets.ONELOCK_KS_PASS }}
        run: ./gradlew :app:assembleRelease -x lint

      - name: Extract version
        id: ver
        run: echo "v=$(grep versionName app/build.gradle.kts | grep -oE '"[0-9.]+"' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneLockBrowser-v${{ steps.ver.outputs.v }}-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-b${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
